# ─────────────────────────────────────────────
#  ИДЕНТИФИКАЦИЯ КНИГИ
# ─────────────────────────────────────────────
title: "Веб глазами древнего человека"
subtitle: "Как древние практики стали технологиями"
author: "imiron.ru (iMironRU)"
author_url: "https://github.com/iMironRU"
language: ru                  # ru | en
license: "CC BY 4.0"

# Версия книги (SemVer: MAJOR.MINOR.PATCH)
# MAJOR — структурная реорганизация, смена концепции
# MINOR — новые главы или значительная переработка
# PATCH — исправления, уточнения, опечатки
version: "0.1.0"

# ─────────────────────────────────────────────
#  ОТСЛЕЖИВАНИЕ ШАБЛОНА
# ─────────────────────────────────────────────
template_repo: "https://github.com/iMironRU/book-template"
template_version: "v0.2.1"

# ─────────────────────────────────────────────
#  ФОРМАТЫ ВЫПУСКА
# ─────────────────────────────────────────────
formats:
  epub:       true    # EPUB для читалок
  fb2:        true    # FB2 для читалок
  pdf_a5:     true    # PDF формат A5 (основной для чтения)
  pdf_a4:     false   # PDF формат A4 (для печати)
  html:       true    # HTML — один самодостаточный файл
  docx:       true    # DOCX стандарт
  docx_a4:    false   # DOCX A4 с полями под печать
  site:       false    # книга ещё не дописана — сайт не публикуем

# Фильтр статуса для сборки:
#   ready   — только главы со статусом ready
#   review  — ready + review
#   all     — все главы, черновики помечаются баннером
release_filter: "review"
nightly_filter: "all"

# ─────────────────────────────────────────────
#  ДОПОЛНИТЕЛЬНЫЕ АРТЕФАКТЫ В РЕЛИЗ
# ─────────────────────────────────────────────
artifacts: []
# - type: zip
#   source: "code/"
#   name: "code-examples"
# - type: file
#   source: "configuration/releases/book.cf"
#   name: "demo"

# ─────────────────────────────────────────────
#  САЙТ (GitHub Pages)
# ─────────────────────────────────────────────
site_url: "https://imiron.ru/web-dev-book/"

# ─────────────────────────────────────────────
#  НОЧНЫЕ СБОРКИ
# ─────────────────────────────────────────────
nightly:
  enabled: true
  branch: "main"

# ─────────────────────────────────────────────
#  PDF — ПАРАМЕТРЫ СТРАНИЦЫ
# ─────────────────────────────────────────────
pdf:
  font_main: "PT Serif"
  font_mono: "JetBrains Mono"
  font_size: "11pt"
  margin_a5: "top=20mm,right=15mm,bottom=20mm,left=20mm"
  margin_a4: "top=25mm,right=20mm,bottom=25mm,left=25mm"

# ─────────────────────────────────────────────
#  НАЗВАНИЯ МОДУЛЕЙ (заголовки разделов в SUMMARY)
# ─────────────────────────────────────────────
modules:
  00_vvedenie: "Модуль 0. Введение"
  01_sayt-eto-chto: "Модуль 1. Сайт — это что вообще?"
  02_pechatnaya-mashinka: "Модуль 2. Печатная машинка: как разметить текст"
  03_stilisticheskiy-reglament: "Модуль 3. Стилистический регламент: оформление не руками"
  04_biblioteka: "Модуль 4. Библиотека: как отдать страницу Васе в Перми"
  05_chuzhoy-ekran: "Модуль 5. Чужой экран: страница подстраивается сама"
  06_samopishushchayasya-kniga: "Модуль 6. Самопишущаяся книга: страницы из шаблона"
  07_kartoteka: "Модуль 7. Картотека: где живут данные"
  08_obratnyy-kanal: "Модуль 8. Обратный канал: читатель приносит данные"
  09_zhivoe-prilozhenie: "Модуль 9. Живое приложение: страница, которая не перезагружается"
  10_mezhvedomstvennaya-perepiska: "Модуль 10. Межбиблиотечный обмен: сайты разговаривают друг с другом"
  11_zapusk-i-ekspluataciya: "Модуль 11. Запуск и эксплуатация: сайт живёт без разработчика"
  12_itog: "Модуль 12. Итог: что мы построили"
